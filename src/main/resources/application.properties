spring.application.name=sightseen
server.port=${PORT:8080}
server.error.include-message=always

# Requests, videos and 3D rooms live under data/ (git-ignored).
sightseen.data-dir=${SIGHTSEEN_DATA:data}
spring.datasource.url=jdbc:h2:file:./data/sightseen
spring.jpa.hibernate.ddl-auto=update

# Phone videos are big, and 4K ones bigger.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# The Python helper that runs MapAnything (worker/app.py).
sightseen.worker.url=${SIGHTSEEN_WORKER:http://localhost:8001}
# apache = facebook/map-anything-apache (Apache 2.0); default = facebook/map-anything (CC-BY-NC 4.0, comparison only)
sightseen.worker.model=apache
# Frames taken from the video: how many per second, and the most in one run (an 8 GB GPU can't take them all).
sightseen.worker.fps=2
sightseen.worker.max-frames=24

# The built React app (frontend/dist) is served straight from its folder, so a rebuild shows up without a restart.
spring.web.resources.static-locations=classpath:/static/,file:frontend/dist/
